<!DOCTYPE HTML>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Arwing (dev)</title>
  <style>
    html, body {
      padding: 0;
      margin: 0;
      height: 100%;
      background: #000;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>

<body>

<pre id="elm"></pre>

<script src="elm.js"></script>
<script>
  var app = Elm.Main.init({
    node: document.getElementById("elm"),
    flags: JSON.parse(localStorage.getItem("arwing-model") || "null")
  });

  app.ports.setStorage.subscribe(function(state) {
    localStorage.setItem("arwing-model", JSON.stringify(state));
  });
</script>

</body>
</html>
